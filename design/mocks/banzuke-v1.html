/*
 * 週の画面に足す4つ目のタブ「番付」（候補3案）。2026-10-11・Fable 5.1が作成。
 * 各案：①12月末 ②6月末 ③1月の空（0頭／10頭に満たない） ④週の画面のタブ4つのヘッダー。
 * 値は1974年開始・世界1通り・土日1鞍で進めた実測（banzuke-data-1974.json・同-jan.json）。
 * 並びは今年の獲得賞金（騎手は今年の勝ち数）。各番付10頭。
 * 注意：モックの都合の値（.frame の 390px 幅・min-height）は実装へ持ち込まない。
 * 級数・余白はトークンだけ。縦線なし。絵文字なし。accent＝読むもの（黄）、action＝押すもの（青）。
 * 動き：行の出現は t-stagger-seq（モーションリファレンス・要素iの開始=i×40ms／各400ms・easeOutCubic）。
 *       値は --m-list-* にまとめ、prefers-reduced-motion では移動を省いて最終状態をそのまま出す。
 */
:root{

  --s1:8px; --s2:16px; --s3:24px; --s4:32px; --s5:40px; --s6:48px;
  --tap:44px;
  --panel:#1a2a18; --panel2:#223a20; --board:#0f160e;
  --fg:#f2ede0; --muted:#9fb896; --dim:#5f7659;
  --accent:#ffd83d; --action:#1a5fb4; --on-action:#fff;
  --turf:#8fd07e; --dirt:#d8b27a;
  --rule:rgba(255,255,255,.1);
  --m-list-dur:400ms; --m-list-gap:40ms; --m-list-ease:cubic-bezier(0.33,1,0.68,1);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0f0c0a;color:var(--fg);font-family:"M PLUS 1p",sans-serif;padding:var(--s3) var(--s2) var(--s6)}
.wrap{max-width:1660px;margin:0 auto}
h1{font-size:var(--fs-lead);font-weight:700;line-height:1.4}

h2 small{display:block;font-size:var(--fs-body);font-weight:400;color:var(--muted);line-height:1.7;max-width:64em}
.intro{font-size:var(--fs-body);color:var(--muted);line-height:1.8;max-width:56em;margin-top:var(--s1)}
.intro b{color:var(--fg);font-weight:500}
.gallery{display:flex;gap:var(--s3);flex-wrap:wrap;align-items:flex-start;margin-top:var(--s3)}
.shot{width:390px;flex:none}
.cap{font-size:var(--fs-caption);color:var(--muted);line-height:1.6;min-height:52px;margin-bottom:var(--s1)}
.cap b{color:var(--fg);font-weight:500}
.frame{width:390px;min-height:720px;background:var(--panel);box-shadow:0 0 0 1px #000;display:flex;flex-direction:column}
.frame .grow{flex:1 1 auto}
.num{font-variant-numeric:tabular-nums}
.sf-turf{color:var(--turf)} .sf-dirt{color:var(--dirt)}

/* ── 週の画面の上部（実装の .wk-hd / .wk-days と同じ見た目）。タブが4つになる ── */
.hd{display:flex;justify-content:space-between;align-items:baseline;padding:var(--s2) var(--s2) var(--s1)}
.hd .wk{font-size:var(--fs-body)}
.hd .left{font-size:var(--fs-caption);color:var(--muted)}
.hd .left b{font-size:var(--fs-lead);color:var(--accent);font-weight:700;margin:0 2px}
.days{display:flex;padding:0 var(--s2);box-shadow:inset 0 -1px 0 var(--rule)}
.days button{all:unset;box-sizing:border-box;cursor:pointer;flex:1;text-align:center;min-height:var(--tap);line-height:var(--tap);font-size:var(--fs-body);font-weight:700;color:var(--muted);border-bottom:2px solid transparent}
.days button.on{color:var(--action);border-bottom-color:var(--action)}
.bar{padding:var(--s2);background:var(--panel2)}
.btn{all:unset;box-sizing:border-box;cursor:pointer;display:block;width:100%;min-height:var(--s6);line-height:var(--s6);text-align:center;background:var(--action);color:var(--on-action);font-size:var(--fs-body);font-weight:700}

/* 土曜の依頼一覧（位置を見せるためだけ・jockey-profile-v1 と同じ借り物） */
.courses{display:flex;gap:var(--s1);padding:var(--s1) var(--s2) 0}
.courses button{all:unset;box-sizing:border-box;cursor:pointer;min-height:var(--tap);padding:0 var(--s2);display:flex;align-items:center;gap:6px;font-size:var(--fs-body);color:var(--muted);background:var(--panel2)}
.courses button.on{background:var(--action);color:#fff}
.courses button .n{font-size:var(--fs-caption);font-weight:700}
.race{padding:var(--s2) var(--s2) 0}
.race .big{font-size:var(--fs-title);font-weight:700;line-height:1.1}
.race .big .cls{font-size:var(--fs-body);font-weight:400;color:var(--muted);margin-left:var(--s1)}
.t{padding:var(--s1) var(--s2) 0}
.th,.r{display:grid;grid-template-columns:minmax(0,1fr) 28px 36px 32px 80px;gap:6px;align-items:center}
.th{font-size:var(--fs-caption);color:var(--dim);padding:var(--s1) 0 4px}
.th .c{text-align:center}.th .tr{text-align:right}
.r{min-height:52px;padding:6px 0;box-shadow:inset 0 1px 0 var(--rule);font-size:var(--fs-caption);color:var(--muted)}
.r .name{font-size:var(--fs-body);font-weight:700;color:var(--fg);line-height:1.3}
.r .name small{display:block;font-size:var(--fs-caption);font-weight:400;color:var(--muted)}
.r .sym{display:block;width:20px;height:20px;margin:0 auto;color:var(--fg)}
.r .tr{text-align:right;line-height:1.4}
.r .tr small{display:block}

/* ── 番付の共通部品 ── */
.yr{display:flex;justify-content:space-between;align-items:baseline;padding:var(--s2) var(--s2) 0}
.yr b{font-size:var(--fs-body);font-weight:700}
.yr span{font-size:var(--fs-caption);color:var(--muted)}
.empty{padding:var(--s2) var(--s2) 0;font-size:var(--fs-body);color:var(--muted);line-height:1.6}
.mk{font-size:var(--fs-caption);font-weight:400;color:var(--accent);margin-left:var(--s1);white-space:nowrap}
/* 行の出現（t-stagger-seq）。--i は行番号 */
.row-in{animation:row-in var(--m-list-dur) var(--m-list-ease) both;animation-delay:calc(var(--i,0) * var(--m-list-gap))}
@keyframes row-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.row-in{animation-name:row-fade;animation-delay:0ms}@keyframes row-fade{from{opacity:0}to{opacity:1}}}

/* ══ 案A：巻物（8つを縦に全部） ══ */
.a-sec{padding:var(--s3) var(--s2) 0}
.a-sec h3{display:flex;justify-content:space-between;align-items:baseline;font-size:var(--fs-caption);font-weight:500;color:var(--muted);letter-spacing:.08em;padding-bottom:4px;box-shadow:inset 0 -1px 0 var(--rule)}
.a-sec h3 span{letter-spacing:0;font-weight:400}
.a-top{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:0 var(--s1);align-items:baseline;padding:var(--s1) 0 var(--s1);box-shadow:inset 0 -1px 0 var(--rule)}
.a-top .rk{font-size:var(--fs-body);color:var(--muted)}
.a-top .nm{font-size:var(--fs-lead);font-weight:700;line-height:1.3}
.a-top .ea{font-size:var(--fs-lead);font-weight:700;color:var(--accent);white-space:nowrap;text-align:right}
.a-top .l2{grid-column:2/4;font-size:var(--fs-caption);color:var(--muted);line-height:1.5;margin-top:2px}
.a-r{display:grid;grid-template-columns:24px minmax(0,1fr) auto auto;gap:0 var(--s1);align-items:baseline;padding:4px 0;box-shadow:inset 0 -1px 0 var(--rule);font-size:var(--fs-body);line-height:1.4}
.a-r:last-child{box-shadow:none}
.a-r .rk{color:var(--muted)}
.a-r .nm{color:var(--fg)}
.a-r .rc{font-size:var(--fs-caption);color:var(--muted);white-space:nowrap}
.a-r .ea{white-space:nowrap;text-align:right;min-width:5.5em}
.a-r .l2{grid-column:2/5;font-size:var(--fs-caption);color:var(--muted);line-height:1.5}
.a-me{margin-top:var(--s1);padding-top:var(--s1);box-shadow:inset 0 1px 0 var(--rule)}
.a-me .a-r{box-shadow:none}
.a-me .a-r .nm{font-weight:700}

.b-hero .l2{font-size:var(--fs-caption);color:var(--muted);line-height:1.5;margin-top:4px}
.b-list{padding:var(--s1) var(--s2) 0}

<h1>番付 v1（候補3案）</h1>

値は1974年開始・世界1通り・土日1鞍で進めた実測。12月末・6月末の番付に自分が乗った馬はいないので、「乗った馬」「主戦」の印は各案1行ずつ仮に付けています（枠の説明文に明記）。
週の上の「1974年 12月5週」「あと6件」は週の画面の見出しそのもので、番付の中では繰り返しません。</p>

     ["1月1週・0頭。板8枚は名前だけ、中は「—」。上に文を1行", () => frame("1974年 1月1週", planC(ZERO, null))],
     ["1週だけ走った後・古馬マイル短距離（7頭）を開いたところ", () => frame("1974年 1月1週", planC(JAN, "古馬マイル短距離"))],
     ["ヘッダー：タブが4つ。土曜を開いているところ。行は借り物（1976年1月1週の実データ）", () => `<div class="frame">${weekSat()}</div>`]]],
];
document.getElementById("root").innerHTML = PLANS.map(([id, t, d, shots]) =>
  `<section data-plan="${id}"><h2>${t}<small>${d}</small></h2><div class="gallery">${shots.map(([cap, fn]) => `<div class="shot"><p class="cap"><b>${cap}</b></p>${fn()}</div>`).join("")}</div></section>`
).join("");
</script></body></html>
